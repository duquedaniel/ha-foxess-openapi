force_charge:
  fields:
    device_sn:
      required: false
      selector:
        text:
    start_time:
      required: true
      example: "06:00:00"
      selector:
        time:
    end_time:
      required: true
      example: "07:59:00"
      selector:
        time:
    target_soc:
      required: true
      example: 35
      selector:
        number:
          min: 10
          max: 100
          unit_of_measurement: "%"
    power:
      required: true
      example: 1500
      selector:
        number:
          min: 0
          max: 10000
          step: 50
          unit_of_measurement: W
    min_soc_on_grid:
      required: false
      selector:
        number:
          min: 10
          max: 100
          unit_of_measurement: "%"
    max_soc:
      required: false
      default: 100
      selector:
        number:
          min: 10
          max: 100
          unit_of_measurement: "%"
    mode:
      required: false
      default: ForceCharge
      selector:
        select:
          options: ["ForceCharge", "ForceCharge(BAT)"]
    replace_all:
      required: false
      default: false
      selector:
        boolean:

set_schedule:
  fields:
    device_sn:
      required: false
      selector:
        text:
    groups:
      required: true
      example: >-
        [{"startHour": 6, "startMinute": 0, "endHour": 7, "endMinute": 59,
        "workMode": "ForceCharge", "minSocOnGrid": 10, "fdSoc": 35, "fdPwr": 1500, "maxSoc": 100}]
      selector:
        object:
    enable_scheduler:
      required: false
      default: true
      selector:
        boolean:

disable_scheduler:
  fields:
    device_sn:
      required: false
      selector:
        text:

set_min_soc:
  fields:
    device_sn:
      required: false
      selector:
        text:
    min_soc:
      required: true
      selector:
        number:
          min: 10
          max: 100
    min_soc_on_grid:
      required: true
      selector:
        number:
          min: 10
          max: 100

set_setting:
  fields:
    device_sn:
      required: false
      selector:
        text:
    key:
      required: true
      selector:
        select:
          options: [ExportLimit, MinSoc, MinSocOnGrid, MaxSoc, GridCode, WorkMode, ActivePowerLimit,
                    ExportLimitPower, EpsOutPut, MaxSetChargeCurrent, MaxSetDischargeCurrent, ECOMode,
                    Meter1Enable, Meter2Enable, SysSwitch, GroundProtection, LowPowerMode]
    value:
      required: true
      selector:
        text:

get_setting:
  fields:
    device_sn:
      required: false
      selector:
        text:
    key:
      required: true
      selector:
        select:
          options: [ExportLimit, MinSoc, MinSocOnGrid, MaxSoc, GridCode, WorkMode, ActivePowerLimit,
                    ExportLimitPower, EpsOutPut, MaxSetChargeCurrent, MaxSetDischargeCurrent, ECOMode,
                    Meter1Enable, Meter2Enable, SysSwitch, GroundProtection, LowPowerMode]

get_schedule:
  fields:
    device_sn:
      required: false
      selector:
        text:
